{% extends "admin/base_admin.html" %}
{% block title %}{{ 'Edit' if category else 'New' }} Category{% endblock %}
{% block content %}
<h1>{{ 'Edit' if category else 'New' }} Category</h1>
<form method="post" style="background:white;padding:1.5rem;border-radius:12px;max-width:500px;">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="form-group">
    <label>Name *</label>
    <input type="text" name="name" class="form-control" required value="{{ category.name if category else '' }}">
  </div>
  <div class="form-group">
    <label>Slug</label>
    <input type="text" name="slug" class="form-control" value="{{ category.slug if category else '' }}">
  </div>
  <div class="form-group">
    <label>Description</label>
    <textarea name="description" class="form-control" rows="2">{{ category.description if category else '' }}</textarea>
  </div>
  <div class="form-group">
    <label><input type="checkbox" name="active" value="1" {% if not category or category.active %}checked{% endif %}> Active</label>
  </div>
  <button type="submit" class="btn btn-primary">Save</button>
  <a href="{{ url_for('admin.categories') }}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
